name: Publish v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project
        run: |
          npm run check
          npm test

      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists."
            exit 0
          fi

          gh release create v0.1.0 \
            --target "${GITHUB_SHA}" \
            --title "AI Workstation Router v0.1.0" \
            --notes-file docs/RELEASE_v0.1.0.md
